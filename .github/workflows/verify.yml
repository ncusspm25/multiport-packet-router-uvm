name: RTL and UVM verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install signed Ubuntu build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git python3 perl ca-certificates autoconf flex bison libfl-dev z3
      - name: Bootstrap pinned official Verilator and UVM sources
        run: python3 scripts/bootstrap_tools.py --jobs 2
      - name: Run smoke, directed matrix, UVM regressions and mutation gates
        run: make verify JOBS=2
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: router-verification-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            reports/
            .build/**/build.log
            .build/coverage/
            .build/regression/**/trace.csv
            .build/mutants/manifest.json
